<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSC 스피킹 마스터 - 통합 버전</title>
    
    <script src="part1_data.js"></script>
    <script src="part2_data.js"></script>
    <script src="part3_1_data.js"></script>
    <script src="part3_2_data.js"></script>
    <script src="part4_data.js"></script>

    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #f5f7fa;
            --text-dark: #2c3e50;
        }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .menu-container { text-align: center; max-width: 700px; width: 100%; margin-top: 50px; }
        .part-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .part-card { background: white; padding: 25px; border-radius: 15px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 2px solid transparent; text-align: center; }
        .part-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .part-card h3, .part-card h4 { margin: 0; }
        
        .config-section { background: #fff; padding: 20px; border-radius: 12px; margin: 0 auto 25px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); width: 100%; max-width: 500px; display: flex; justify-content: center; }
        .config-row { display: flex; align-items: center; gap: 15px; font-size: 1rem; }
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; font-weight: bold; cursor: pointer; background-color: #f9f9f9; }

        .card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; background: #eee; padding: 8px 15px; border-radius: 10px; }
        .score-box { display: flex; gap: 10px; }
        .correct { color: var(--success-color); }
        .wrong { color: var(--danger-color); }

        .settings-bar { background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #timer-display { font-size: 2rem; font-weight: bold; color: var(--danger-color); }
        .timer-progress { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin: 10px 0 20px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--danger-color); transition: width 1s linear; }

        .blur-box { background: #f1f3f5; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; border: 1px dashed #ced4da; text-align: center; cursor: pointer; }
        .blur-box.revealed { background: #fff9db; border: 1px solid #ffe066; text-align: left; cursor: default; }
        
        .pinyin-blur { cursor: pointer !important; background: #e2e8f0 !important; color: transparent !important; text-shadow: 0 0 15px rgba(0,0,0,0.6) !important; border-radius: 8px !important; padding: 2px 10px !important; transition: 0.2s; user-select: none; }
        .pinyin-blur.revealed { color: #7f8c8d !important; text-shadow: none !important; background: transparent !important; user-select: auto; }

        .audio-btn-wrapper { margin-bottom: 25px; } 
        .chinese { font-size: 1.7rem; font-weight: bold; color: var(--text-dark); margin: 0; }
        .pinyin { font-size: 1.1rem; color: #7f8c8d; margin-bottom: 15px; min-height: 1.6rem; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .show-btn { background: var(--primary-color); color: white; width: 100%; }
        .correct-btn { background: var(--success-color); color: white; flex: 1; }
        .wrong-btn { background: var(--danger-color); color: white; flex: 1; }
        .exit-btn { background: #636e72; color: white; width: 100%; margin-top: 15px; }
        .home-btn { background: none; border: 1px solid #ccc; margin-bottom: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="main-menu" class="menu-container">
        <h1>🇨🇳 TSC 스피킹 마스터</h1>
        
        <div class="config-section">
            <div class="config-row">
                <strong>🔥 난이도 설정:</strong>
                <select id="difficulty-select">
                    <option value="easy">Easy (힌트 자동공개)</option>
                    <option value="medium" selected>Medium (기본)</option>
                    <option value="hard">Hard (병음 가리기)</option>
                </select>
            </div>
        </div>

        <div id="mode-selection">
            <h3>학습 방식을 선택하세요</h3>
            <div class="part-grid">
                <div class="part-card" onclick="showPartMenu(true)"><h3>랜덤 학습</h3></div>
                <div class="part-card" onclick="showPartMenu(false)"><h3>순차 학습</h3></div>
            </div>
        </div>

        <div id="part-selection" class="hidden" style="margin-top: 20px;">
            <h3 id="mode-title">파트를 선택하세요</h3>
            <div class="part-grid">
                <div class="part-card" onclick="startPart(1)"><h4>제 1부분</h4></div>
                <div class="part-card" onclick="startPart(2)"><h4>제 2부분</h4></div>
                <div class="part-card" onclick="startPart('3_1')"><h4>제 3부분 - 1</h4></div>
                <div class="part-card" onclick="startPart('3_2')"><h4>제 3부분 - 2</h4></div>
                <div class="part-card" onclick="startPart(4)"><h4>제 4부분</h4></div>
            </div>
            <button class="home-btn" style="margin-top: 20px;" onclick="location.reload()">처음으로</button>
        </div>
    </div>

    <div id="study-page" class="hidden" style="width: 100%; flex-direction: column; align-items: center;">
        <button class="home-btn" onclick="location.reload()">🏠 메인으로</button>
        <div class="card">
            <div class="status-bar">
                <span class="progress-text">진행: <span id="current-pos">0</span> / <span id="total-count">0</span></span>
                <div class="score-box">
                    <span class="correct">정답: <span id="count-correct">0</span></span>
                    <span class="wrong">오답: <span id="count-wrong">0</span></span>
                </div>
            </div>
            <div id="jump-container" class="jump-box hidden" style="margin-bottom:15px;">
                <input type="number" id="jump-to" style="width:50px; text-align:center;" placeholder="No.">
                <button onclick="jumpToNumber()">이동</button>
            </div>
            <div class="settings-bar">
                <span>🐢</span>
                <input type="range" id="speed-range" min="0.5" max="1.2" step="0.1" value="0.9" onchange="updateSpeedText()">
                <span>🚀</span> <span id="speed-val">0.9x</span>
            </div>
            <div id="timer-display">30</div>
            <div class="timer-progress"><div id="timer-bar"></div></div>
            <div id="hint-container" class="blur-box" onclick="revealHint()">
                <div id="hint-placeholder">🔍 클릭하여 힌트 보기</div>
                <div id="hint-content" class="hidden">
                    <strong>💡 힌트:</strong> <span id="q-hint"></span><br>
                    <strong>🔑 키워드:</strong> <span id="q-keywords"></span>
                </div>
            </div>
            <div id="question-area">
                <p class="chinese" id="q-text"></p>
                <p id="q-pinyin" class="pinyin" onclick="this.classList.add('revealed')"></p>
                <div class="audio-btn-wrapper"><button onclick="playTTS('q-text')">🔊 다시듣기</button></div>
            </div>
            <div id="answer-area" class="hidden">
                <hr><p class="chinese" id="a-text" style="color:var(--success-color)"></p>
                <p class="pinyin" id="a-pinyin"></p>
                <div class="audio-btn-wrapper"><button onclick="playTTS('a-text')">🔊 정답듣기</button></div>
            </div>
            <button class="show-btn" id="show-btn" onclick="showAnswer()">답변 확인</button>
            <div id="feedback-group" class="btn-group hidden">
                <button class="correct-btn" onclick="handleResult(true)">알아요</button>
                <button class="wrong-btn" onclick="handleResult(false)">몰라요</button>
            </div>
            <button class="exit-btn" onclick="confirmExit()">종료 및 리포트</button>
        </div>
    </div>

    <script>
        let fullData = [];
        let studyQueue = [];
        let currentIdx = 0;
        let isRandomMode = true;
        let difficulty = 'medium';
        let totalWrongSet = new Set();
        let timerInterval;
        let timeLeft = 30;
        let correctCount = 0;
        let wrongCount = 0;

        // 메인 메뉴 제어
        function showPartMenu(random) {
            isRandomMode = random;
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('part-selection').classList.remove('hidden');
            document.getElementById('mode-title').innerText = (random ? "랜덤 학습" : "순차 학습") + " - 파트를 선택하세요";
        }

        // 학습 시작 준비
        function startPart(part) {
            let data;
            if(part === 1) data = PART1_DATA;
            else if(part === 2) data = PART2_DATA;
            else if(part === '3_1') data = PART3_1_DATA;
            else if(part === '3_2') data = PART3_2_DATA;
            else if(part === 4) data = PART4_DATA;

            if(!data) return alert("데이터를 찾을 수 없습니다.");
            
            difficulty = document.getElementById('difficulty-select').value;
            fullData = [...data];
            fullData.forEach(item => { if(!item.weight) item.weight = 1; });
            studyQueue = [...fullData];
            
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('study-page').classList.remove('hidden');
            document.getElementById('study-page').style.display = 'flex';
            document.getElementById('total-count').innerText = fullData.length;
            
            if (!isRandomMode) document.getElementById('jump-container').classList.remove('hidden');
            nextQuestion();
        }

        function playTTS(id, callback) {
            const text = document.getElementById(id).innerText;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = parseFloat(document.getElementById('speed-range').value);
            const voices = window.speechSynthesis.getVoices();
            const cnVoice = voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN');
            if (cnVoice) u.voice = cnVoice;
            if (callback) u.onend = callback;
            window.speechSynthesis.speak(u);
        }

        function updateSpeedText() { document.getElementById('speed-val').innerText = document.getElementById('speed-range').value + "x"; }

        function revealHint() {
            document.getElementById('hint-container').classList.add('revealed');
            document.getElementById('hint-placeholder').classList.add('hidden');
            document.getElementById('hint-content').classList.remove('hidden');
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            resetUI();
            if (studyQueue.length === 0) { alert("완수했습니다!"); confirmExit(); return; }
            if (!isRandomMode && currentIdx >= studyQueue.length) { finishSequentialSession(); return; }
            
            let item = isRandomMode ? getWeightedRandomItemFromQueue() : studyQueue[currentIdx];
            document.getElementById('current-pos').innerText = isRandomMode ? correctCount : (currentIdx + 1);
            renderQuestion(item);
            if (difficulty === 'easy') revealHint();
            playTTS('q-text', startTimer);
        }

        function renderQuestion(item) {
            document.getElementById('q-text').innerText = item.q;
            const qPinyin = document.getElementById('q-pinyin');
            qPinyin.innerText = item.qP;
            if (difficulty === 'hard') { qPinyin.classList.remove('revealed'); qPinyin.classList.add('pinyin-blur'); }
            else { qPinyin.classList.remove('pinyin-blur', 'revealed'); }
            document.getElementById('q-hint').innerText = item.hint || "없음";
            document.getElementById('q-keywords').innerText = item.keywords || "없음";
            document.getElementById('a-text').innerText = item.a;
            document.getElementById('a-pinyin').innerText = item.aP;
        }

        function showAnswer() {
            clearInterval(timerInterval);
            revealHint();
            document.getElementById('q-pinyin').classList.add('revealed');
            document.getElementById('answer-area').classList.remove('hidden');
            document.getElementById('feedback-group').classList.remove('hidden');
            document.getElementById('show-btn').classList.add('hidden');
        }

        function handleResult(isCorrect) {
            const currentItem = studyQueue[currentIdx];
            if (isCorrect) {
                correctCount++;
                if (isRandomMode) studyQueue.splice(currentIdx, 1);
                else currentIdx++;
            } else {
                wrongCount++;
                totalWrongSet.add(currentItem);
                currentItem.weight = (currentItem.weight || 1) + 3;
                if (!isRandomMode) currentIdx++;
            }
            updateScoreUI();
            nextQuestion();
        }

        function resetUI() {
            document.getElementById('answer-area').classList.add('hidden');
            document.getElementById('feedback-group').classList.add('hidden');
            document.getElementById('show-btn').classList.remove('hidden');
            const hintCont = document.getElementById('hint-container');
            hintCont.classList.remove('revealed');
            document.getElementById('hint-placeholder').classList.remove('hidden');
            document.getElementById('hint-content').classList.add('hidden');
            document.getElementById('q-pinyin').classList.remove('revealed');
        }

        function jumpToNumber() {
            const target = parseInt(document.getElementById('jump-to').value);
            if (isNaN(target) || target <= (currentIdx + 1) || target > studyQueue.length) return alert(`번호 확인 필요`);
            correctCount += (target - 1 - currentIdx);
            currentIdx = target - 1;
            updateScoreUI(); nextQuestion();
        }

        function startTimer() {
            timeLeft = 30;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                document.getElementById('timer-bar').style.width = (timeLeft / 30 * 100) + "%";
                if (timeLeft <= 0) { clearInterval(timerInterval); showAnswer(); }
            }, 1000);
        }

        function updateScoreUI() {
            document.getElementById('count-correct').innerText = correctCount;
            document.getElementById('count-wrong').innerText = wrongCount;
        }

        function getWeightedRandomItemFromQueue() {
            let total = studyQueue.reduce((s, i) => s + (i.weight || 1), 0);
            let r = Math.random() * total;
            for (let i = 0; i < studyQueue.length; i++) {
                if (r < (studyQueue[i].weight || 1)) { currentIdx = i; return studyQueue[i]; }
                r -= (studyQueue[i].weight || 1);
            }
            currentIdx = 0; return studyQueue[0];
        }

        function finishSequentialSession() {
            let wrongs = Array.from(totalWrongSet);
            if (wrongs.length > 0 && confirm(`복습할까요?`)) { studyQueue = wrongs; currentIdx = 0; nextQuestion(); }
            else confirmExit();
        }

        function confirmExit() {
            if (totalWrongSet.size > 0 && confirm(`오답 리포트를 다운로드할까요?`)) {
                let csv = "\uFEFF구분,질문,답변\n";
                totalWrongSet.forEach(i => csv += `오답,"${i.q}","${i.a}"\n`);
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `TSC_Report.csv`;
                a.click();
            }
            location.reload();
        }
    </script>
</body>
</html>
